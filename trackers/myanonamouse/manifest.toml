name = "myanonamouse"
canonical_category = "myanonamouse.net"
version = "1.0.0"
description = """
Add a torrent from MyAnonamouse (MAM) to qBittorrent.

The LLM is given the full HTML of the torrent page (e.g.
https://www.myanonamouse.net/t/<id>) and must extract the fields below by
reading the visible page text. Where a field's source is the inline
`data-tormissdataj="{...}"` JSON on the "Submit Updated or Missing
Information" button, that is noted explicitly; otherwise the value is on
the rendered page.

Library layout produced (post-processor appends sanitize(<torrent_name>)
as the leaf of every link site, so the scraped <title> is *part of the
link path*, not the leaf):

  <main_cat_name>/<sub_category>/<title>     (one per main_cat × sub-category)
  _authors/<author>/<title>                  (one per author, if any)
  _series/<series>/<title>                   (one per series, if any)
  _narrators/<narrator>/<title>              (one per narrator, if any)
  _isbn/<isbn>/<title>                       (when an Identifier is present)
"""

url_pattern = '^https?://(www\.)?myanonamouse\.net/t/\d+'

[[input]]
name = "url"
type = "string"
required = true
description = """
Canonical tracker URL of the torrent page, of the form
`https://www.myanonamouse.net/t/<id>`. Used for logging only.
"""

[[input]]
name = "title"
type = "string"
required = true
description = """
The torrent's display title, scraped verbatim (with original casing and
punctuation) from `<span class="TorrentTitle">…</span>` in the "Title"
row. The host sanitizes it before it becomes a path component, so do not
strip slashes or punctuation manually.
"""

[[input]]
name = "main_cat"
type = "array<int>"
required = true
min_items = 1
description = """
Top-level MAM category IDs that apply to this torrent. Almost always a
singleton; pass an array of length 1 in the common case.

ID table:
  13 = AudioBooks
  14 = E-Books
  15 = Musicology
  16 = Radio

These are *not* the numeric `main_cat` value inside `data-tormissdataj`
(which uses a different ID space). Infer the correct ID by reading the
page: the visible top-level category sprite, the "Filetypes" row (pdf /
epub → E-Books; mp3 / m4b → AudioBooks; etc.), the presence of an ISBN
("Identifier"), narrators (AudioBooks), and so on.
"""

[[input]]
name = "categories"
type = "array<string>"
required = true
min_items = 1
description = """
Sub-category display names. For each `<a class="mCat" data-mcatid="…">NAME</a>`
inside `<div id="multiCat">`, pass NAME verbatim (e.g. "Horror",
"Mystery", "Thriller/Suspense"). Order is irrelevant. Slashes inside a
name are preserved as additional path levels (so "Thriller/Suspense"
yields a `Thriller/Suspense/` two-component directory).
"""
cli_flag = "--categories"

[[input]]
name = "authors"
type = "array<string>"
required = false
default = []
description = """
Author display names, one entry per anchor inside the
`<div class="torDetRight torAuthors">` block (the row labelled
"Authors"). Use visible names verbatim. Pass `[]` when the page lists no
authors.
"""
cli_flag = "--author"

[[input]]
name = "narrators"
type = "array<string>"
required = false
default = []
description = """
Narrator names, one per anchor in the "Narrators" details row when the
page exposes it (AudioBooks). Empty array otherwise.
"""
cli_flag = "--narrator"

[[input]]
name = "series"
type = "array<string>"
required = false
default = []
description = """
Series names, one per anchor in the "Series" details row when the page
exposes it. Empty array otherwise.
"""
cli_flag = "--series"

[[input]]
name = "isbn"
type = "string"
required = false
description = """
The value of the "Identifier" inner box in the File Info section (an
ISBN/ASIN/etc.), when present. Pass the raw string verbatim — do not
strip hyphens.
"""

[[input]]
name = "language"
type = "string"
required = false
description = """
Language as displayed on the page (e.g. "English"), when present. Used
as an info tag only — does not affect the library layout.
"""

[[input]]
name = "labels"
type = "array<string>"
required = false
default = []
description = """
Free-form labels from the "Tags and Labels:" row, comma-split and
trimmed of surrounding whitespace. Pass verbatim, including duplicates
of sub-category names — this matches MAM's own rendering and lets the
operator search by either.
"""
cli_flag = "--label"

[[input]]
name = "primary_filetype"
type = "string"
required = false
description = """
The single value of the "Filetypes" inner box (e.g. "pdf", "epub",
"mp3"). Ignore the "Secondary" row. Used as an info tag only.
"""
