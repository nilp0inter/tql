# tql starter config — generated by `tql config init`.
#
# Edit this file, then verify with:
#     tql config show
#     tql doctor
#
# Secrets are NEVER inlined here. Each `*_env` field names the env var that
# carries the actual value at runtime. Set those env vars in your service
# manager (systemd EnvironmentFile=, NixOS module, etc.).

[paths]
# Where qBittorrent writes finished torrents.
seed_root = "/var/lib/qbittorrent/downloads"
# Where tql materializes the link-tag-driven layout.
library_root = "/srv/media"
# Tracker bundles (manifest.toml + classify.rhai + fixtures/).
trackers_root = "/etc/tql/trackers"

[linking]
# "hardlink" (default), "reflink", or "reflink_or_hardlink".
prefer = "hardlink"
windows_compat = false

[qbittorrent]
url = "http://127.0.0.1:8080"
username = "admin"
# Set QBIT_PASSWORD in the environment; tql reads the value at use time.
password_env = "QBIT_PASSWORD"

[notify]
# Backends to fire by default ("telegram", etc.). Empty = no-op spool drain.
default = []

# [notify.telegram]
# bot_token_env = "TQL_TELEGRAM_BOT_TOKEN"
# chat_id = "123456789"

# [media.plex]
# url = "http://127.0.0.1:32400"
# token_env = "PLEX_TOKEN"
# section_ids = [1, 2]

# [media.jellyfin]
# url = "http://127.0.0.1:8096"
# api_key_env = "JELLYFIN_API_KEY"

[reconcile]
parallelism = 4
adopt_orphans = true
remove_stale = true

[mcp]
# "stdio" (default) or "http".
transport = "stdio"
http_addr = "127.0.0.1:7373"
# api_key_env = "TQL_MCP_API_KEY"  # required when transport = "http"

[api]
addr = "127.0.0.1:7374"
# api_key_env = "TQL_API_KEY"

[scripting]
reload_on_change = false
max_script_runtime_ms = 200
max_script_memory_mb = 16

# Per-tracker credentials for URL .torrent fetches.
# Keys match the tracker `name` from each manifest.toml.
#
# [trackers.example]
# cookie_env = "EXAMPLE_COOKIE"
# auth_header_env = "EXAMPLE_AUTH"
