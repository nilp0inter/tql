[package]
name = "tql"
version = "0.0.1"
edition = "2021"
description = "Tracker-Qualified Layout — organize qBittorrent downloads in a ghq-style tracker-faithful tree."
license = "MIT OR Apache-2.0"
repository = "https://github.com/nilp0inter/tql"
readme = "README.md"
keywords = ["qbittorrent", "torrent", "mcp", "rhai"]
categories = ["command-line-utilities"]

[[bin]]
name = "tql"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
unicode-normalization = "0.1"
percent-encoding = "2"
serde_json = "1"
fs2 = "0.4"
reflink-copy = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
rhai = { version = "1", default-features = false, features = ["std", "sync"] }
handlebars = { version = "5", default-features = false }
sha1 = "0.10"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
# Several error enums in this crate are intentionally large (carry the full
# offending state for diagnostics). Boxing them adds an indirection without
# meaningful payoff at our scale.
result_large_err = "allow"
