[package]
name = "tql"
version = "0.0.1"
edition = "2021"
description = "Tracker-Qualified Layout — organize qBittorrent downloads in a ghq-style tracker-faithful tree."
license = "MIT OR Apache-2.0"

[[bin]]
name = "tql"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
unicode-normalization = "0.1"
serde_json = "1"
fs2 = "0.4"
reflink-copy = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "multipart"] }
rhai = { version = "1", default-features = false, features = ["std", "sync"] }
sha1 = "0.10"
axum = "0.7"

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
